<!DOCTYPE html>
<html lang="{{ current_language|default('es') }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Prodify{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('send_favicon_svg') }}">
    <link rel="alternate icon" type="image/x-icon" href="{{ url_for('send_favicon') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    {% block extra_head %}{% endblock %}
</head>

<body class="login-body">

    <main class="login-container">
        <h1 class="login-title">Prodify</h1>
        {% if subtitle %}<p class="login-subtitle">{{ subtitle }}</p>{% endif %}
        <div class="login-box">
            {% block content %}{% endblock %}
        </div>
    </main>

</body>

</html>
