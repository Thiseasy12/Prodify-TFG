<!DOCTYPE html>
<!-- Plantilla base que heredan todas las paginas de autenticacion (login, registro, recuperacion). -->
<html lang="{{ current_language|default('es') }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Token CSRF para proteger los formularios contra ataques de falsificacion. -->
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Prodify{% endblock %}</title>
    <!-- Favicon en SVG con fallback a .ico para navegadores antiguos. -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('send_favicon_svg') }}">
    <link rel="alternate icon" type="image/x-icon" href="{{ url_for('send_favicon') }}">
    <!-- Precarga de Google Fonts para reducir el tiempo de bloqueo de renderizado. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap como base de utilidades de layout y reset. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Hoja de estilos principal de Prodify. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    {% block extra_head %}{% endblock %}
</head>

<!-- login-body aplica el fondo oscuro animado con esferas de luz que diseñamos. -->
<body class="login-body">

    <!-- Contenedor centrado que aloja el logo y la caja de formulario. -->
    <main class="login-container">
        <h1 class="login-title">Prodify</h1>
        <!-- El subtitulo varia segun la pagina hija que extiende esta base. -->
        {% if subtitle %}<p class="login-subtitle">{{ subtitle }}</p>{% endif %}
        <!-- login-box es la caja con efecto glassmorfismo donde va el formulario. -->
        <div class="login-box">
            {% block content %}{% endblock %}
        </div>
    </main>

</body>

</html>
