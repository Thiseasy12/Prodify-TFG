<!DOCTYPE html>
<html lang="{{ current_language|default('es') }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Nueva contraseña | Prodify</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('send_favicon_svg') }}">
    <link rel="alternate icon" type="image/x-icon" href="{{ url_for('send_favicon') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="login-body">

    <main class="login-container">
        <h1 class="login-title">Prodify</h1>
        <p class="login-subtitle">Define una nueva contraseña para volver a entrar.</p>
        <div class="login-box">
            <h2>Cambiar contraseña</h2>
            {{ message_html }}
            {% if not token_error %}
            <form action="{{ url_for('reset_password', token=token) }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="password" name="password" class="form-control" placeholder="Nueva contraseña" minlength="8" required>
                <p class="login-helper">Debe incluir mayúscula, minúscula, número y carácter especial.</p>
                <input type="password" name="confirm_password" class="form-control" placeholder="Repite la contraseña" minlength="8" required>
                <button type="submit" class="btn btn-login w-100">Guardar contraseña</button>
            </form>
            {% endif %}
            <hr>
            <div class="login-footer">
                <a href="{{ url_for('login') }}">Volver al login</a> -
                <a href="{{ url_for('forgot_password') }}">Solicitar otro enlace</a>
            </div>
        </div>
    </main>

</body>

</html>
