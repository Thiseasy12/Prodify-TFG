<!DOCTYPE html>
<html lang="{{ current_language|default('es') }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Prodify | {{ t('index.title') }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('send_favicon_svg') }}">
    <link rel="alternate icon" type="image/x-icon" href="{{ url_for('send_favicon') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="boards-page">
    <!-- Barra superior principal con marca, buscador y menu de usuario. -->
    <header class="topbar navbar navbar-expand-lg">
        <div class="container-fluid px-3 px-lg-4">
            <div class="topbar-left d-flex align-items-center">
                <div class="brand-pill">
                    <span class="brand-icon">P</span>
                    <span class="brand-text">Prodify</span>
                </div>
            </div>

            <div class="topbar-center d-flex align-items-center">
                <input class="search-input form-control" type="text" placeholder="{{ t('topbar.search_boards') }}">
                <div class="create-menu-wrap">
                    <button class="create-btn js-create-workspace btn" type="button" aria-haspopup="true" aria-expanded="false">{{ t('common.create') }}</button>
                    <div class="create-dropdown" id="createDropdown" hidden>
                        <button type="button" class="create-dropdown-item js-create-board-option">
                            <span class="create-dropdown-icon" aria-hidden="true">▥</span>
                            <span><strong>{{ t('common.create_board') }}</strong><small>{{ t('common.create_board_help') }}</small></span>
                        </button>
                        <button type="button" class="create-dropdown-item js-create-template-option">
                            <span class="create-dropdown-icon" aria-hidden="true">⊞</span>
                            <span><strong>{{ t('common.start_with_template') }}</strong><small>{{ t('common.template_help') }}</small></span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="topbar-right">
                <button class="theme-toggle btn" id="themeToggle" type="button" aria-label="{{ t('theme.toggle') }}">{{ t('theme.light') }}</button>
                {{ language_switcher_html }}
                {{ account_toggle_html }}
                {{ account_menu_html }}
            </div>
        </div>
    </header>

    <!-- Layout general con sidebar a la izquierda y contenido a la derecha. -->
    <main class="layout container-fluid p-0">
        <div class="row g-0 min-vh-100">
            <aside class="sidebar col-12 col-lg-3 col-xl-2">
                <!-- Navegacion principal entre las pantallas mas importantes. -->
                {{ side_nav_html }}

                <div class="workspace-title">{{ t('workspace.title') }}</div>

                <!-- Aqui recorro los espacios creados por el usuario. -->
                {{ workspace_list_html }}
            </aside>

            <section class="content col-12 col-lg-9 col-xl-10">
                <!-- Bloque de tableros vistos hace poco. -->
                <h2 class="section-title">{{ t('workspace.recent') }}</h2>
                <div class="boards-row row g-3 mb-4">{{ recent_boards_html }}</div>

                <h2 class="section-title section-spaced">{{ t('workspace.your_workspaces') }}</h2>

                <!-- En este bloque enseño cada espacio con sus tableros. -->
                {{ workspace_blocks_html }}
            </section>
        </div>
    </main>

    <!-- Formularios ocultos que luego relleno desde JavaScript. -->
    <form id="workspaceCreateForm" action="{{ url_for('create_workspace') }}" method="POST" hidden>
        <input type="text" name="workspace_name" id="workspaceNameInput">
        <input type="text" name="board_name" id="workspaceBoardNameInput">
    </form>

    <form id="boardCreateForm" action="" method="POST" hidden>
        <input type="text" name="board_name" id="boardNameInput">
    </form>

    <form id="templateCreateForm" action="{{ url_for('use_template') }}" method="POST" hidden>
        <input type="text" name="workspace_name" id="templateWorkspaceInput">
        <input type="hidden" name="workspace_id" id="templateWorkspaceIdInput">
        <input type="text" name="board_name" id="templateBoardInput">
        <input type="hidden" name="template_id" id="templateIdInput">
    </form>

    <form id="workspaceUpdateForm" action="" method="POST" hidden>
        <input type="text" name="workspace_name" id="workspaceUpdateNameInput">
    </form>

    <script id="boardCreationWorkspaces" type="application/json">{{ manageable_workspaces|tojson }}</script>
    <script id="boardCreationTemplates" type="application/json">{{ board_templates|tojson }}</script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('js_static', filename='script.js') }}"></script>
</body>

</html>
