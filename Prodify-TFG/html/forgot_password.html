<!DOCTYPE html>
<html lang="{{ current_language|default('es') }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Recuperar acceso | Prodify</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('send_favicon_svg') }}">
    <link rel="alternate icon" type="image/x-icon" href="{{ url_for('send_favicon') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="login-body">

    <main class="login-container">
        <h1 class="login-title">Prodify</h1>
        <p class="login-subtitle">Si no puedes iniciar sesión, te enviaremos un correo seguro para recuperar tu cuenta.</p>
        <div class="login-box">
            <h2>Recuperar acceso</h2>
            {{ message_html }}
            <form action="{{ url_for('forgot_password') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="email" name="email" class="form-control" placeholder="Correo electronico" required>
                <button type="submit" class="btn btn-login w-100">Enviar correo de recuperacion</button>
            </form>
            <hr>
            <div class="login-footer">
                <a href="{{ url_for('login') }}">Volver al login</a> -
                <a href="{{ url_for('register') }}">Crear cuenta</a>
            </div>
        </div>
    </main>

</body>

</html>
