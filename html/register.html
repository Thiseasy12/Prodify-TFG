<!DOCTYPE html>
<html lang="{{ current_language|default('es') }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Registro | Prodify</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('send_favicon_svg') }}">
    <link rel="alternate icon" type="image/x-icon" href="{{ url_for('send_favicon') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="login-body">

    <main class="login-container">
        <h1 class="login-title">Prodify</h1>
        <p class="login-subtitle">Crea una cuenta real para guardar tus tableros en la base de datos.</p>
        <div class="login-box">
            <h2>Registra tu cuenta</h2>
            {{ message_html }}
            <form action="{{ url_for('register') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="next" value="{{ next_url or '' }}">
                <input type="text" name="display_name" class="form-control" placeholder="Nombre visible (opcional)">
                <input type="email" name="email" class="form-control" placeholder="Correo electronico" value="{{ prefilled_email or '' }}" required>
                <input type="password" name="password" class="form-control" placeholder="Contraseña" minlength="8" required>
                <p class="login-helper">Usa al menos 8 caracteres con mayúscula, minúscula, número y símbolo.</p>
                <input type="password" name="confirm_password" class="form-control" placeholder="Repite la contraseña" minlength="8" required>
                <button type="submit" class="btn btn-login w-100">Crear cuenta</button>
            </form>
            <hr>
            <div class="login-footer">
                <a href="{{ url_for('login', next=next_url or '', email=prefilled_email or '') }}">Ya tengo cuenta</a> -
                <a href="{{ url_for('forgot_password') }}">Recuperar acceso</a>
            </div>
        </div>
    </main>

</body>

</html>
